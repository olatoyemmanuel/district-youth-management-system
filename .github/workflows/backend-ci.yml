name: Backend CI

on:
  push:
    branches:
      - phase-1/requirements-consolidation
  pull_request:
    branches:
      - phase-1/requirements-consolidation

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    env:
      # AppModule validates configuration. End-to-end tests replace Prisma,
      # so this syntactically valid URL does not require a running database.
      DATABASE_URL: postgresql://dyms_ci:dyms_ci@127.0.0.1:5432/dyms_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Run lint
        run: npm run lint
